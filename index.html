        function App() {
          // Inicijalizacija jezika: localStorage -> auto detekcija browsera -> default 'bs'
          const [currentLang, setCurrentLang] = useState(() => {
            try {
              const saved = localStorage.getItem('nv_lang');
              if (saved && ['bs', 'de', 'en'].includes(saved)) {
                return saved;
              }
              const browser = (navigator.language || navigator.userLanguage || '').toLowerCase();
              if (browser.startsWith('de')) return 'de';
              if (browser.startsWith('en')) return 'en';
              return 'bs';
            } catch (e) {
              return 'bs';
            }
          });

          const t = TRANSLATIONS[currentLang] || TRANSLATIONS.bs;

          const changeLanguage = (newLang) => {
            setCurrentLang(newLang);
            try {
              localStorage.setItem('nv_lang', newLang);
            } catch (e) {}
            setIsLangMenuOpen(false);
            setIsDesktopLangMenuOpen(false);
          };

          const [currentPage, setCurrentPage] = useState('home');
          const [selectedCategory, setSelectedCategory] = useState(null);
          const [isMenuCollectionExpanded, setIsMenuCollectionExpanded] = useState(false);
          const [selectedProduct, setSelectedProduct] = useState(null);
          const [activeImageIndex, setActiveImageIndex] = useState(0);
          const [isMenuOpen, setIsMenuOpen] = useState(false);
          const [isImpressumOpen, setIsImpressumOpen] = useState(false);
          const [isDatenschutzOpen, setIsDatenschutzOpen] = useState(false);
          const [showImpressumDetails, setShowImpressumDetails] = useState(false);

          // Dropdown state za jezike
          const [isLangMenuOpen, setIsLangMenuOpen] = useState(false);
          const [isDesktopLangMenuOpen, setIsDesktopLangMenuOpen] = useState(false);
          const langDropdownRef = useRef(null);
          const desktopLangDropdownRef = useRef(null);

          // Zatvaranje dropdowna na klik izvan njega
          useEffect(() => {
            const handleClickOutside = (e) => {
              if (langDropdownRef.current && !langDropdownRef.current.contains(e.target)) {
                setIsLangMenuOpen(false);
              }
              if (desktopLangDropdownRef.current && !desktopLangDropdownRef.current.contains(e.target)) {
                setIsDesktopLangMenuOpen(false);
              }
            };
            document.addEventListener('mousedown', handleClickOutside);
            return () => document.removeEventListener('mousedown', handleClickOutside);
          }, []);

          // Form state za direktan kontakt / email
          const [contactName, setContactName] = useState('');
          const [contactEmail, setContactEmail] = useState('');
          const [contactMessage, setContactMessage] = useState('');
          const [contactSubmitted, setContactSubmitted] = useState(false);

          // Sinkronizacija sa URL hash-om
          useEffect(() => {
            const handleHash = () => {
              const hash = window.location.hash;
              if (hash.startsWith('#kolekcija')) {
                setCurrentPage('kolekcija');
                const parts = hash.split('/');
                if (parts[1]) {
                  const cat = CATEGORIES_DATA.find(c => c.id === parts[1] || c.categoryKey.toLowerCase() === decodeURIComponent(parts[1]).toLowerCase());
                  if (cat) {
                    setSelectedCategory(cat.categoryKey);
                  }
                }
              } else {
                setCurrentPage('home');
              }
            };
            handleHash();
            window.addEventListener('hashchange', handleHash);
            return () => window.removeEventListener('hashchange', handleHash);
          }, []);

          const handleContactSubmit = (e) => {
            e.preventDefault();
            const subject = encodeURIComponent(`Nova Venturi - Upit (${contactName || 'Kupac'})`);
            const body = encodeURIComponent(`Ime: ${contactName}\nEmail: ${contactEmail}\n\nPoruka:\n${contactMessage}`);
            window.location.href = `mailto:info@novaventuri.com?subject=${subject}&body=${body}`;
            setContactSubmitted(true);
          };

          const openModal = (p) => {
            setSelectedProduct(p);
            setActiveImageIndex(0);
            document.body.style.overflow = 'hidden';
          };

          const bestsellerScrollRef = useRef(null);

          const scrollBestseller = (direction) => {
            if (bestsellerScrollRef.current) {
              const scrollAmount = Math.min(bestsellerScrollRef.current.clientWidth * 0.8, 320);
              bestsellerScrollRef.current.scrollBy({
                left: direction === 'left' ? -scrollAmount : scrollAmount,
                behavior: 'smooth'
              });
            }
          };

          const closeModal = () => {
            setSelectedProduct(null);
            document.body.style.overflow = 'auto';
          };

          const navigateTo = (page, targetId) => {
            setCurrentPage(page);
            setIsMenuOpen(false);
            if (page === 'home') {
              if (targetId) {
                window.location.hash = targetId;
                setTimeout(() => {
                  const el = document.getElementById(targetId);
                  if (el) el.scrollIntoView({ behavior: 'smooth' });
                }, 80);
              } else {
                window.location.hash = '';
                window.scrollTo({ top: 0, behavior: 'smooth' });
              }
            } else {
              setSelectedCategory(null);
              window.location.hash = '#kolekcija';
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
          };

          const openCategoryPage = (categoryKey) => {
            setCurrentPage('kolekcija');
            setSelectedCategory(categoryKey);
            setIsMenuOpen(false);
            const cat = CATEGORIES_DATA.find(c => c.categoryKey === categoryKey);
            window.location.hash = cat ? `#kolekcija/${cat.id}` : '#kolekcija';
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };

          const scrollToContact = (e) => {
            if (e) e.preventDefault();
            setIsMenuOpen(false);
            if (currentPage !== 'home') {
              navigateTo('home', 'kontakt');
            } else {
              const el = document.getElementById('kontakt');
              if (el) {
                el.scrollIntoView({ behavior: 'smooth' });
                const emailInput = document.getElementById('contact-email');
                if (emailInput) emailInput.focus();
              }
            }
          };

          const activeCategoryProducts = selectedCategory 
            ? PRODUCTS.filter(p => p.categories.includes(selectedCategory))
            : [];

          const currentCategoryObj = CATEGORIES_DATA.find(c => c.categoryKey === selectedCategory);

                  {/* Breadcrumb navigacija */}
                  <div className="flex flex-wrap items-center justify-between gap-4 mb-8 pb-5 border-b border-stone-200">
                    <div className="flex items-center gap-2 text-sm text-stone-500">
                      <button 
                        onClick={() => navigateTo('home')} 
                        className="hover:text-amber-950 flex items-center gap-1 font-medium cursor-pointer transition-colors"
                      >
                        <ArrowLeft size={16} />
                        <span>{t.collectionBreadcrumbHome}</span>
                      </button>
                      <span>/</span>
                      <button 
                        onClick={() => setSelectedCategory(null)} 
                        className={`font-medium transition-colors cursor-pointer ${
                          selectedCategory === null ? 'text-amber-950 font-bold' : 'hover:text-amber-950'
                        }`}
                      >
                        {t.collectionBreadcrumbAll}
                      </button>
                      {selectedCategory && (
                        <>
                          <span>/</span>
                          <span className="text-amber-950 font-bold">{currentCategoryName}</span>
                        </>
                      )}
                    </div>

                    {selectedCategory ? (
                      <button
                        onClick={() => {
                          setSelectedCategory(null);
                          window.location.hash = '#kolekcija';
                          window.scrollTo({ top: 0, behavior: 'smooth' });
                        }}
                        className="inline-flex items-center gap-2 px-4 py-2 bg-stone-100 hover:bg-stone-200 text-stone-800 rounded-xl text-xs sm:text-sm font-semibold transition-colors cursor-pointer shadow-sm"
                      >
                        <ArrowLeft size={16} />
                        <span>{t.collectionBackToAll}</span>
                      </button>
                    ) : (
                      <button
                        onClick={() => navigateTo('home')}
                        className="inline-flex items-center gap-2 px-4 py-2 bg-stone-100 hover:bg-stone-200 text-stone-800 rounded-xl text-xs sm:text-sm font-semibold transition-colors cursor-pointer shadow-sm"
                      >
                        <ArrowLeft size={16} />
                        <span>{t.collectionBackToHome}</span>
                      </button>
                    )}
                  </div>

                  {/* PRIKAZ 1: Sve kategorije (jedna ispod druge sa 3s slajderom) */}
                  {selectedCategory === null ? (
                    <div className="space-y-8 animate-fade-in">
                      <div className="text-center max-w-2xl mx-auto mb-10">
                        <span className="text-amber-900 font-bold uppercase tracking-wider text-xs md:text-sm bg-amber-100/70 border border-amber-200/60 px-3.5 py-1.5 rounded-full inline-block mb-3">
                          {t.collectionHeaderBadge}
                        </span>
                        <h1 className="text-3xl sm:text-5xl font-bold text-stone-900 mb-3 tracking-tight">
                          {t.collectionHeaderTitle}
                        </h1>
                        <p className="text-stone-600 text-sm sm:text-base leading-relaxed">
                          {t.collectionHeaderDesc}
                        </p>
                      </div>

                      {/* Prikaz kategorija: Jedna ispod druge */}
                      <div className="flex flex-col gap-6 md:gap-8">
                        {CATEGORIES_DATA.map((cat) => (
                          <CategoryCard
                            key={cat.id}
                            category={cat}
                            onSelect={openCategoryPage}
                            lang={currentLang}
                            t={t}
                          />
                        ))}
                      </div>
                    </div>
                  ) : (
                    /* PRIKAZ 2: Čista mreža (grid) proizvoda izabrane kategorije */
                    <div className="animate-fade-in">
                      <div className="mb-8 text-left">
                        <span className="text-amber-900 font-bold uppercase tracking-wider text-xs bg-amber-100/80 px-3 py-1 rounded-full inline-block mb-2">
                          {currentCategoryName} • {activeCategoryProducts.length} {currentLang === 'de' ? 'Produkte' : currentLang === 'en' ? 'products' : 'proizvoda'}
                        </span>
                        <h1 className="text-3xl sm:text-5xl font-bold text-stone-900 mb-3 tracking-tight">
                          {currentCategoryName}
                        </h1>
                        <p className="text-stone-600 text-sm sm:text-base max-w-2xl leading-relaxed">
                          {currentCategoryDesc}
                        </p>
                      </div>

                      {/* Čista mreža proizvoda iz ove kategorije */}
                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
                        {activeCategoryProducts.map((p) => (
                          <ProductCard
                            key={p.id}
                            product={p}
                            onOpen={openModal}
                            lang={currentLang}
                            t={t}
                          />
                        ))}
                      </div>

                      {/* Poseban profesionalni disclaimer ispod proizvoda za kategoriju KUHINJA */}
                      {selectedCategory === 'Kuhinja' && (
                        <div className="mt-8 p-5 bg-amber-50/90 border border-amber-900/20 rounded-2xl text-stone-700 text-xs sm:text-sm flex items-start gap-3 shadow-xs">
                          <span className="text-amber-900 font-bold text-base mt-0.5">ℹ️</span>
                          <div>
                            <span className="font-bold text-amber-950 block mb-1">{t.kuhinjaDisclaimerTitle}</span>
                            <p className="text-stone-600 leading-relaxed">{t.kuhinjaDisclaimerText}</p>
                          </div>
                        </div>
                      )}

                      {/* Donji navigacijski blok */}
                      <div className="mt-14 p-6 sm:p-8 bg-amber-50/60 border border-amber-900/10 rounded-3xl flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left">
                        <div>
                          <h4 className="font-bold text-stone-900 text-lg">{t.collectionExploreOtherTitle}</h4>
                          <p className="text-stone-600 text-sm mt-1">{t.collectionExploreOtherDesc}</p>
                        </div>
                        <button
                          onClick={() => {
                            setSelectedCategory(null);
                            window.location.hash = '#kolekcija';
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                          }}
                          className="px-6 py-3 bg-amber-950 hover:bg-amber-900 text-white rounded-xl font-bold text-sm transition-all flex items-center gap-2 cursor-pointer shadow-md"
                        >
                          <ArrowLeft size={16} />
                          <span>{t.collectionAllCategoriesBtn}</span>
                        </button>
                      </div>
                    </div>
                  )}
                </main>
              )}

              {/* FOOTER */}
              <footer className="bg-stone-900 pt-20 pb-10 border-t border-white/5 px-6 text-stone-400">
                <div className="container mx-auto grid md:grid-cols-4 gap-12 mb-16">
                  <div className="col-span-2">
                    <div 
                      className="flex items-center gap-2 mb-6 cursor-pointer text-white" 
                      onClick={() => {
                        setSelectedCategory(null);
                        navigateTo('home');
                      }}
                    >
                      <Logo className="w-8 h-8" dark={false} />
                      <span className="text-xl font-bold tracking-tighter uppercase">NOVA VENTURI</span>
                    </div>
                    <p className="text-stone-400 max-w-sm mb-6">{t.footerAboutText}</p>
                    <div className="flex gap-4">
                      <a href="https://www.instagram.com/nova.venturi/" target="_blank" rel="noopener noreferrer" aria-label="Instagram @nova.venturi" title="Instagram @nova.venturi" className="w-10 h-10 bg-white/5 rounded-full flex items-center justify-center text-stone-400 shadow-sm hover:text-white hover:bg-amber-900 transition-all">
                        <Instagram size={20} />
                      </a>
                      <a href="https://www.etsy.com/shop/novaventuri/" target="_blank" rel="noopener noreferrer" aria-label="Etsy Shop" title="Etsy Shop" className="w-10 h-10 bg-white/5 rounded-full flex items-center justify-center text-stone-400 shadow-sm hover:text-white hover:bg-amber-900 transition-all">
                        <ShoppingBag size={20} />
                      </a>
                      <button onClick={scrollToContact} aria-label="Kontakt" className="w-10 h-10 bg-white/5 rounded-full flex items-center justify-center text-stone-400 shadow-sm hover:text-white hover:bg-amber-900 transition-all cursor-pointer">
                        <Mail size={20} />
                      </button>
                    </div>
                  </div>
                  <div>
                    <h4 className="font-bold mb-6 text-white">{t.footerBestsellers}</h4>
                    <ul className="space-y-4">
                      {BEST_SELLERS.map(p => (
                        <li key={p.id}>
                          <button 
                            onClick={() => openModal(p)} 
                            className="hover:text-amber-500 transition-colors cursor-pointer text-left text-sm"
                          >
                            {getProductName(p, currentLang)}
                          </button>
                        </li>
                      ))}
                    </ul>
                  </div>
                  <div>
                    <h4 className="font-bold mb-6 text-white">{t.footerContact}</h4>
                    <ul className="space-y-4">
                      <li><button onClick={scrollToContact} className="hover:text-amber-500 transition-colors cursor-pointer">{t.contactUsBtn}</button></li>
                      <li><a href="mailto:info@novaventuri.com" className="hover:text-amber-500 transition-colors">info@novaventuri.com</a></li>
                      <li><a href="https://www.instagram.com/nova.venturi/" target="_blank" rel="noopener noreferrer" className="hover:text-amber-500 transition-colors">Instagram @nova.venturi</a></li>
                    </ul>
                  </div>
                </div>
                <div className="border-t border-white/10 pt-10 flex flex-col md:flex-row justify-between items-center gap-4 text-stone-500 text-sm">
                  <p>{t.footerRights}</p>
                  <div className="flex gap-6">
                    <button onClick={() => { setIsImpressumOpen(true); setShowImpressumDetails(false); }} className="hover:text-amber-500 transition-colors cursor-pointer">Impressum</button>
                    <button onClick={() => setIsDatenschutzOpen(true)} className="hover:text-amber-500 transition-colors cursor-pointer">Datenschutz</button>
                  </div>
                </div>
              </footer>

              {/* MOBILNI MENI DRAWER (BEZ EMOJIJA I POPRAVKA LINKA KOLEKCIJA) */}
              <AnimatePresence>
                {isMenuOpen && (
                  <motion.div 
                    initial={{ opacity: 0, x: '100%' }}
                    animate={{ opacity: 1, x: 0 }}
                    exit={{ opacity: 0, x: '100%' }}
                    className="fixed inset-0 z-[9999] bg-white flex flex-col md:hidden"
                  >
                    <div className="container mx-auto px-6 h-20 flex items-center justify-between border-b border-stone-100">
                      <div className="flex items-center gap-2">
                        <Logo className="w-8 h-8" />
                        <span className="text-xl font-bold tracking-tighter text-amber-950">NOVA VENTURI</span>
                      </div>
                      <button onClick={() => setIsMenuOpen(false)} className="p-2 cursor-pointer">
                        <X size={28} />
                      </button>
                    </div>

                    <div className="flex-grow p-6 flex flex-col gap-4 text-lg font-bold text-stone-800 overflow-y-auto">
                      {/* Početna (bez ikonica/emojija) */}
                      <button 
                        onClick={() => navigateTo('home')} 
                        className={`flex items-center justify-between border-b border-stone-100 pb-3 transition-colors text-left w-full cursor-pointer ${
                          currentPage === 'home' ? 'text-amber-950 font-bold' : 'hover:text-amber-900'
                        }`}
                      >
                        <span>{t.navHome}</span>
                        <ChevronRight size={18} className="text-stone-400" />
                      </button>

                      {/* Best Seller (BEZ zvezdice i proizvoljnih emojija) */}
                      <button 
                        onClick={() => navigateTo('home', 'bestseller')} 
                        className="flex items-center justify-between border-b border-stone-100 pb-3 hover:text-amber-900 transition-colors text-left w-full cursor-pointer"
                      >
                        <span>{t.navBestSeller}</span>
                        <ChevronRight size={18} className="text-stone-400" />
                      </button>

                      {/* Kolekcija s preciznom logikom:
                          - Klik na sam tekst 'Kolekcija' vodi odmah na sve kolekcije
                          - Klik na strelicu pored naziva tek tada proširuje podmeni
                          - Bez ikonica/emojija poput komada drveta
                      */}
                      <div className="border-b border-stone-100 pb-3">
                        <div className="flex items-center justify-between py-1 select-none">
                          {/* Klik direktno na tekst 'Kolekcija' vodi odmah na sve kolekcije */}
                          <div 
                            onClick={() => {
                              setSelectedCategory(null);
                              navigateTo('kolekcija');
                            }}
                            className="flex items-center gap-2 cursor-pointer flex-grow"
                          >
                            <span className={currentPage === 'kolekcija' ? 'text-amber-950 font-bold' : 'text-stone-900'}>
                              {t.navCollection}
                            </span>
                            <span className="text-xs bg-amber-100 text-amber-900 font-bold px-2 py-0.5 rounded-full">
                              {CATEGORIES_DATA.length}
                            </span>
                          </div>

                          {/* Klik na strelicu tek tada proširuje podmeni s pojedinačnim kategorijama */}
                          <button
                            type="button"
                            onClick={(e) => {
                              e.stopPropagation();
                              setIsMenuCollectionExpanded(!isMenuCollectionExpanded);
                            }}
                            className="p-2 -mr-2 text-stone-400 hover:text-amber-950 transition-colors cursor-pointer"
                            aria-label="Proširi podmeni kategorija"
                          >
                            <ChevronDown 
                              size={20} 
                              className={`transition-transform duration-200 ${isMenuCollectionExpanded ? 'rotate-180' : ''}`} 
                            />
                          </button>
                        </div>

                        {/* Podmeni kategorija koji se otvara na strelicu */}
                        {isMenuCollectionExpanded && (
                          <div className="mt-2.5 pl-2 flex flex-col gap-1.5 text-sm font-medium animate-fade-in">
                            <button
                              onClick={() => {
                                setSelectedCategory(null);
                                navigateTo('kolekcija');
                              }}
                              className={`w-full py-2.5 px-3 rounded-xl flex items-center justify-between text-left transition-colors cursor-pointer ${
                                currentPage === 'kolekcija' && selectedCategory === null 
                                  ? 'bg-amber-100 text-amber-950 font-bold' 
                                  : 'hover:bg-stone-50 text-stone-700'
                              }`}
                            >
                              <span>{t.drawerAllCategories}</span>
                              <span className="text-xs bg-stone-200/80 px-2 py-0.5 rounded-full font-bold">{CATEGORIES_DATA.length}</span>
                            </button>

                            {CATEGORIES_DATA.map((cat) => (
                              <button
                                key={cat.id}
                                onClick={() => openCategoryPage(cat.categoryKey)}
                                className={`w-full py-2.5 px-3 rounded-xl flex items-center justify-between text-left transition-colors cursor-pointer ${
                                  currentPage === 'kolekcija' && selectedCategory === cat.categoryKey 
                                    ? 'bg-amber-100 text-amber-950 font-bold' 
                                    : 'hover:bg-stone-50 text-stone-700'
                                }`}
                              >
                                <span>{getCategoryName(cat, currentLang)}</span>
                                <span className="text-xs bg-stone-200/80 px-2 py-0.5 rounded-full font-bold">{cat.count}</span>
                              </button>
                            ))}
                          </div>
                        )}
                      </div>

                      {/* O nama */}
                      <button 
                        onClick={() => navigateTo('home', 'o-nama')} 
                        className="flex items-center justify-between border-b border-stone-100 pb-3 hover:text-amber-900 transition-colors text-left w-full cursor-pointer"
                      >
                        <span>{t.navAbout}</span>
                        <ChevronRight size={18} className="text-stone-400" />
                      </button>

                      {/* Kontakt */}
                      <button 
                        onClick={scrollToContact} 
                        className="flex items-center justify-between border-b border-stone-100 pb-3 text-left cursor-pointer hover:text-amber-900 transition-colors w-full"
                      >
                        <span>{t.contactBadge}</span>
                        <ChevronRight size={18} className="text-stone-400" />
                      </button>

                      {/* Izbor jezika u Burger Draweru */}
                      <div className="pt-2">
                        <span className="text-xs font-bold uppercase tracking-wider text-stone-400 block mb-2">Jezik / Language</span>
                        <div className="grid grid-cols-3 gap-2">
                          <button
                            onClick={() => changeLanguage('bs')}
                            className={`py-2 px-3 rounded-xl text-xs font-bold transition-all cursor-pointer ${
                              currentLang === 'bs' ? 'bg-amber-950 text-white shadow-sm' : 'bg-stone-100 text-stone-700 hover:bg-stone-200'
                            }`}
                          >
                            Bosanski
                          </button>
                          <button
                            onClick={() => changeLanguage('de')}
                            className={`py-2 px-3 rounded-xl text-xs font-bold transition-all cursor-pointer ${
                              currentLang === 'de' ? 'bg-amber-950 text-white shadow-sm' : 'bg-stone-100 text-stone-700 hover:bg-stone-200'
                            }`}
                          >
                            Deutsch
                          </button>
                          <button
                            onClick={() => changeLanguage('en')}
                            className={`py-2 px-3 rounded-xl text-xs font-bold transition-all cursor-pointer ${
                              currentLang === 'en' ? 'bg-amber-950 text-white shadow-sm' : 'bg-stone-100 text-stone-700 hover:bg-stone-200'
                            }`}
                          >
                            English
                          </button>
                        </div>
                      </div>

                      {/* Standardne socijalne i kontakt ikone */}
                      <div className="mt-auto pt-4 flex flex-col gap-3">
                        <button 
                          onClick={scrollToContact} 
                          className="w-full py-4 bg-amber-950 text-white rounded-2xl flex items-center justify-center gap-3 shadow-xl shadow-amber-950/20 text-base font-bold cursor-pointer"
                        >
                          <Mail size={18} />
                          <span>{t.contactUsBtn}</span>
                        </button>
                        <a 
                          href="https://www.instagram.com/nova.venturi/" 
                          target="_blank" 
                          rel="noopener noreferrer" 
                          className="w-full py-3.5 bg-stone-100 text-stone-800 rounded-2xl flex items-center justify-center gap-2.5 font-semibold hover:bg-stone-200 transition-colors text-base"
                        >
                          <Instagram size={20} className="text-amber-900" /> 
                          <span>{t.drawerVisitInstagram}</span>
                        </a>
                      </div>
                    </div>
                  </motion.div>
                )}
              </AnimatePresence>
            </div>
          );
        }

        const rootElement = document.getElementById('root');
        if (rootElement) {
          const root = createRoot(rootElement);
          root.render(<App />);
        }
    </script>
</body>
</html>
