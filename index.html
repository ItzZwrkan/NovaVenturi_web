                      <h2 className="text-3xl md:text-4xl font-bold mb-2 md:mb-4">Izdvojeno iz Trgovine</h2>
                      <p className="text-stone-600 text-sm md:text-base">Najprodavaniji unikatni komadi iz naše radionice.</p>
                    </div>
                    <button onClick={() => navigateTo('collection')} className="text-amber-900 font-bold flex items-center gap-2 hover:gap-3 transition-all border-b-2 border-amber-900/20 pb-1 text-sm md:text-base">
                      Cijela Kolekcija <ArrowRight size={18} />
                    </button>
                  </div>
                  
                  <div className="grid grid-cols-1 xs:grid-cols-2 lg:grid-cols-4 gap-6 md:gap-8">
                    {PRODUCTS.slice(0, 4).map(p => (
                      <div key={p.id} onClick={() => openModal(p)} className="group bg-white rounded-2xl overflow-hidden shadow-sm border border-stone-100 hover:shadow-xl transition-all cursor-pointer">
                        <div className="h-56 md:h-64 overflow-hidden relative">
                          <img src={p.image} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" alt={p.name} referrerPolicy="no-referrer" />
                          <div className="absolute top-3 left-3 flex flex-wrap gap-1">
                            {p.categories.map((cat, idx) => (
                              <span key={idx} className="px-2 py-0.5 bg-white/90 backdrop-blur shadow-sm rounded-full text-[10px] font-bold text-stone-600 uppercase">{cat}</span>
                            ))}
                          </div>
                        </div>
                        <div className="p-5 md:p-6">
                          <h3 className="text-lg md:text-xl font-bold mb-1 md:mb-2 group-hover:text-amber-900 transition-colors line-clamp-1">{p.name}</h3>
                          <div className="flex items-center justify-between mt-4">
                            <span className="text-xl md:text-2xl font-bold text-stone-900">{p.price}</span>
                            <span className="text-amber-900 font-bold text-xs md:text-sm flex items-center gap-1">Detalji <ArrowRight size={14} /></span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </section>

              <section id="personalizacija" className="py-16 md:py-24 bg-amber-950 text-white px-6 relative overflow-hidden">
                <div className="absolute top-0 right-0 w-1/2 h-full opacity-10 pointer-events-none">
                  <img src="https://images.unsplash.com/photo-1533090161767-e6ffed986c88?auto=format&fit=crop&q=80&w=1000" className="w-full h-full object-cover" alt="Woodworking detail" referrerPolicy="no-referrer" />
                </div>
                <div className="container mx-auto relative z-10 text-center">
                  <div className="inline-flex items-center justify-center w-12 h-12 md:w-16 md:h-16 bg-amber-900 rounded-xl md:rounded-2xl mb-6 md:mb-8 shadow-xl mx-auto">
                    <MessageSquare size={24} className="text-amber-200 md:w-8 md:h-8" />
                  </div>
                  <h2 className="text-3xl md:text-5xl font-bold mb-4 md:mb-6">Imate unikatnu ideju?</h2>
                  <p className="text-base md:text-xl text-amber-100/80 mb-8 md:mb-12 max-w-2xl mx-auto leading-relaxed">Bilo da želite personaliziranu gravuru na nekom od naših proizvoda ili imate potpuno novu ideju za drveni predmet, tu smo da je oživimo.</p>
                  <div className="flex justify-center">
                    <a 
                      href="mailto:info@novaventuri.com" 
                      className="px-12 py-5 bg-white text-amber-950 rounded-2xl font-bold text-xl hover:bg-amber-50 transition-all flex items-center justify-center gap-3 shadow-2xl hover:scale-105 active:scale-95"
                    >
                      Pošaljite upit putem emaila <Mail size={24} />
                    </a>
                  </div>
                </div>
              </section>

              <section id="o-nama" className="py-16 md:py-24 bg-white px-6 overflow-hidden">
                <div className="container mx-auto grid grid-cols-1 md:grid-cols-2 gap-10 md:gap-16 items-center">
                  <div className="relative">
                    <div className="absolute -top-10 -left-10 w-32 h-32 md:w-40 md:h-40 bg-amber-100 rounded-full blur-3xl opacity-50"></div>
                    <div className="relative z-10 p-2 bg-white rounded-2xl md:rounded-3xl shadow-2xl border border-stone-100">
                      <img src="https://the9thdoor.com/wp-content/uploads/2019/12/images1290-5dea8e0be6c7e.jpg" className="rounded-xl md:rounded-2xl" alt="About us" referrerPolicy="no-referrer" />
                    </div>
                    <div className="absolute -bottom-4 -right-4 md:-bottom-6 md:-right-6 bg-amber-950 text-white p-4 md:p-6 rounded-xl md:rounded-2xl shadow-xl z-20 hidden xs:block">
                      <p className="text-[10px] md:text-xs font-bold opacity-80 uppercase tracking-widest mb-1">Ponosni Etsy Prodavač</p>
                      <div className="flex items-center gap-1 text-amber-400 text-xs md:text-base">★★★★★</div>
                    </div>
                  </div>
                  <div>
                    <h2 className="text-3xl md:text-4xl font-bold mb-4 md:mb-6">Od hobija do prepoznatljivog brenda</h2>
                    <p className="text-stone-600 mb-4 md:mb-6 text-base md:text-lg">Nova Venturi je nastala iz strasti prema finoj obradi drveta. Ono što je počelo kao izrada poklona za prijatelje, pretvorilo se u butik trgovinu čiji su proizvodi putovali diljem svijeta putem naše Etsy trgovine.</p>
                    <p className="text-stone-600 mb-6 md:mb-8 text-base md:text-lg">Vjerujemo da moderni dodaci ne moraju biti od plastike. Drvo nudi toplinu, težinu i teksturu koju nijedan drugi materijal ne može zamijeniti.</p>
                    <div className="grid grid-cols-2 gap-4 md:gap-8">
                      <div><h4 className="font-bold text-amber-950 mb-1 italic serif text-sm md:text-base">Brza Isporuka</h4><p className="text-stone-500 text-xs">Pažljivo zapakirano u ekološku ambalažu.</p></div>
                      <div><h4 className="font-bold text-amber-950 mb-1 italic serif text-sm md:text-base">Custom Rad</h4><p className="text-stone-500 text-xs">Graviramo vaše inicijale ili logotipe.</p></div>
                    </div>
                  </div>
                </div>
              </section>

              {/* Kontakt Sekcija s Formom za Email */}
              <section id="kontakt" className="py-16 md:py-24 bg-stone-100 px-6 border-t border-stone-200/80">
                <div className="container mx-auto max-w-4xl">
                  <div className="text-center mb-10 md:mb-14">
                    <span className="text-amber-900 font-bold uppercase tracking-wider text-xs md:text-sm">Direktan Kontakt</span>
                    <h2 className="text-3xl md:text-5xl font-bold text-stone-900 mt-2 mb-4">Kontaktirajte nas</h2>
                    <p className="text-stone-600 text-base md:text-lg max-w-xl mx-auto leading-relaxed">
                      Ovdje nam možete poslati upit za narudžbu, personaliziranu gravuru ili suradnju. Rado ćemo vam odgovoriti u najkraćem roku.
                    </p>
                  </div>

                  <div className="bg-white rounded-3xl shadow-xl border border-stone-200/80 p-6 md:p-12">
                    <form onSubmit={handleContactSubmit} className="space-y-6">
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                          <label htmlFor="contact-name" className="block text-xs font-bold uppercase tracking-wider text-stone-700 mb-2">
                            Vaše ime
                          </label>
                          <input
                            id="contact-name"
                            type="text"
                            value={contactName}
                            onChange={(e) => setContactName(e.target.value)}
                            placeholder="Npr. Marko Marković"
                            className="w-full px-4 py-3.5 rounded-xl border border-stone-300 focus:border-amber-900 focus:ring-2 focus:ring-amber-900/20 outline-none transition-all text-stone-800 text-base bg-stone-50/60"
                          />
                        </div>
                        <div>
                          <label htmlFor="contact-email" className="block text-xs font-bold uppercase tracking-wider text-stone-700 mb-2">
                            Vaša email adresa <span className="text-amber-900">*</span>
                          </label>
                          <input
                            id="contact-email"
                            type="email"
                            required
                            value={contactEmail}
                            onChange={(e) => setContactEmail(e.target.value)}
                            placeholder="vas.email@primjer.com"
                            className="w-full px-4 py-3.5 rounded-xl border border-stone-300 focus:border-amber-900 focus:ring-2 focus:ring-amber-900/20 outline-none transition-all text-stone-800 text-base bg-stone-50/60"
                          />
                        </div>
                      </div>

                      <div>
                        <label htmlFor="contact-message" className="block text-xs font-bold uppercase tracking-wider text-stone-700 mb-2">
                          Poruka ili upit za proizvod <span className="text-amber-900">*</span>
                        </label>
                        <textarea
                          id="contact-message"
                          required
                          rows={4}
                          value={contactMessage}
                          onChange={(e) => setContactMessage(e.target.value)}
                          placeholder="Napišite koji proizvod vas zanima, posebne želje za gravuru ili bilo koje pitanje..."
                          className="w-full px-4 py-3.5 rounded-xl border border-stone-300 focus:border-amber-900 focus:ring-2 focus:ring-amber-900/20 outline-none transition-all text-stone-800 text-base bg-stone-50/60 resize-none"
                        />
                      </div>

                      <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 pt-2">
                        <button
                          type="submit"
                          className="px-8 py-4 bg-amber-950 text-white rounded-xl font-bold text-base hover:bg-amber-900 active:scale-[0.98] transition-all flex items-center justify-center gap-2.5 shadow-lg shadow-amber-950/20 cursor-pointer"
                        >
                          <Mail size={18} />
                          <span>Pošaljite poruku</span>
                        </button>

                        <div className="flex flex-wrap items-center gap-4 text-stone-600 text-sm justify-center sm:justify-end">
                          <a 
                            href="mailto:info@novaventuri.com" 
                            className="font-bold text-amber-900 hover:underline flex items-center gap-1.5"
                          >
                            <Mail size={16} /> info@novaventuri.com
                          </a>
                          <span className="text-stone-300">•</span>
                          <a 
                            href="https://www.instagram.com/nova.venturi/" 
                            target="_blank" 
                            rel="noopener noreferrer" 
                            className="font-bold text-amber-900 hover:underline flex items-center gap-1.5"
                          >
                            <Instagram size={16} /> @nova.venturi
                          </a>
                        </div>
                      </div>

                      {contactSubmitted && (
                        <div className="p-4 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl text-sm flex items-center gap-2">
                          <CheckCircle2 size={18} className="text-emerald-600 flex-shrink-0" />
                          <span>Vaš email program je otvoren s pripremljenim tekstom. Hvala vam na javljanju!</span>
                        </div>
                      )}
                    </form>
                  </div>
                </div>
              </section>

              <footer className="bg-stone-900 pt-20 pb-10 border-t border-white/5 px-6 text-stone-400">
                <div className="container mx-auto grid md:grid-cols-4 gap-12 mb-16">
                  <div className="col-span-2">
                    <div className="flex items-center gap-2 mb-6 cursor-pointer text-white" onClick={() => navigateTo('home')}>
                      <Logo className="w-8 h-8" dark={false} />
                      <span className="text-xl font-bold tracking-tighter uppercase">NOVA VENTURI</span>
                    </div>
                    <p className="text-stone-400 max-w-sm mb-6">Butik radionica specijalizirana za vrhunske drvene uredske dodatke i unikatne detalje.</p>
                    <div className="flex gap-4">
                      <a href="https://www.instagram.com/nova.venturi/" target="_blank" rel="noopener noreferrer" className="w-10 h-10 bg-white/5 rounded-full flex items-center justify-center text-stone-400 shadow-sm hover:text-white hover:bg-amber-900 transition-all">
                        <Instagram size={20} />
                      </a>
                      <a href="#" className="w-10 h-10 bg-white/5 rounded-full flex items-center justify-center text-stone-400 shadow-sm hover:text-white hover:bg-amber-900 transition-all">
                        <Facebook size={20} />
                      </a>
                      <button onClick={scrollToContact} className="w-10 h-10 bg-white/5 rounded-full flex items-center justify-center text-stone-400 shadow-sm hover:text-white hover:bg-amber-900 transition-all cursor-pointer">
                        <Mail size={20} />
                      </button>
                    </div>
                  </div>
                  <div>
                    <h4 className="font-bold mb-6 text-white">Kategorije</h4>
                    <ul className="space-y-4">
                      <li><button onClick={() => { navigateTo('collection'); setActiveCategory('Uredski dodaci'); }} className="hover:text-amber-500 transition-colors">Uredski dodaci</button></li>
                      <li><button onClick={() => { navigateTo('collection'); setActiveCategory('Organizacija'); }} className="hover:text-amber-500 transition-colors">Organizacija</button></li>
                      <li><button onClick={() => { navigateTo('collection'); setActiveCategory('Kuhinja'); }} className="hover:text-amber-500 transition-colors">Kuhinja</button></li>
                    </ul>
                  </div>
                  <div>
                    <h4 className="font-bold mb-6 text-white">Kontakt & Info</h4>
                    <ul className="space-y-4">
                      <li><button onClick={scrollToContact} className="hover:text-amber-500 transition-colors">Kontaktirajte nas</button></li>
                      <li><a href="mailto:info@novaventuri.com" className="hover:text-amber-500 transition-colors">info@novaventuri.com</a></li>
                      <li><a href="https://www.instagram.com/nova.venturi/" target="_blank" rel="noopener noreferrer" className="hover:text-amber-500 transition-colors">Instagram @nova.venturi</a></li>
                    </ul>
                  </div>
                </div>
                <div className="border-t border-white/10 pt-10 flex flex-col md:flex-row justify-between items-center gap-4 text-stone-500 text-sm">
                  <p>© 2024 Nova Venturi Woodworking.</p>
                  <div className="flex gap-6">
                    <button onClick={() => { setIsImpressumOpen(true); setShowImpressumDetails(false); }} className="hover:text-amber-500 transition-colors">Impressum</button>
                    <button onClick={() => setIsDatenschutzOpen(true)} className="hover:text-amber-500 transition-colors">Datenschutz</button>
                  </div>
                </div>
              </footer>

              <AnimatePresence>
                {isMenuOpen && (
                  <motion.div 
                    initial={{ opacity: 0, x: '100%' }}
                    animate={{ opacity: 1, x: 0 }}
                    exit={{ opacity: 0, x: '100%' }}
                    className="fixed inset-0 z-[9999] bg-white flex flex-col md:hidden"
                  >
                    <div className="container mx-auto px-6 h-20 flex items-center justify-between border-b border-stone-100">
                      <div className="flex items-center gap-2">
                        <Logo className="w-8 h-8" />
                        <span className="text-xl font-bold tracking-tighter text-amber-950">NOVA VENTURI</span>
                      </div>
                      <button onClick={() => setIsMenuOpen(false)}>
                        <X size={28} />
                      </button>
                    </div>
                    <div className="flex-grow p-6 flex flex-col gap-6 text-xl font-bold text-stone-800">
                      <button onClick={() => { navigateTo('collection'); setIsMenuOpen(false); }} className="flex items-center justify-between border-b border-stone-100 pb-3 text-left">
                        Kolekcija <ChevronRight size={20} className="text-amber-900" />
                      </button>
                      <a href="#o-nama" onClick={() => setIsMenuOpen(false)} className="flex items-center justify-between border-b border-stone-100 pb-3">
                        O nama <ChevronRight size={20} className="text-amber-900" />
                      </a>
                      <a href="#personalizacija" onClick={() => setIsMenuOpen(false)} className="flex items-center justify-between border-b border-stone-100 pb-3">
                        Personalizacija <ChevronRight size={20} className="text-amber-900" />
                      </a>
                      <button onClick={scrollToContact} className="flex items-center justify-between border-b border-stone-100 pb-3 text-left">
                        Kontakt <ChevronRight size={20} className="text-amber-900" />
                      </button>
                      <div className="mt-2 flex flex-col gap-3">
                        <button 
                          onClick={scrollToContact} 
                          className="w-full py-4 bg-amber-950 text-white rounded-2xl flex items-center justify-center gap-3 shadow-xl shadow-amber-950/20 text-base font-bold cursor-pointer"
                        >
                          <Mail size={18} />
                          Kontaktirajte nas
                        </button>
                        <a 
                          href="https://www.instagram.com/nova.venturi/" 
                          target="_blank" 
                          rel="noopener noreferrer" 
                          className="w-full py-3.5 bg-stone-100 text-stone-800 rounded-2xl flex items-center justify-center gap-2.5 font-semibold hover:bg-stone-200 transition-colors text-base"
                        >
                          <Instagram size={20} className="text-amber-900" /> Posjetite naš Instagram
                        </a>
                      </div>
                    </div>
                  </motion.div>
                )}
              </AnimatePresence>
            </div>
          );
        }

        const rootElement = document.getElementById('root');
        if (rootElement) {
          const root = createRoot(rootElement);
          root.render(<App />);
        }
    </script>
</body>
</html>
